
<button type="button" class="tool-link" id="downloadBtn">
  ⬇ Download PDF
</button>

<div id="serviceAlert" class="service-alert-overlay">
  <div class="service-alert-box">
    <div class="alert-pattern"></div>
    <button id="closeServiceAlertX" class="alert-x">×</button>
    <div class="alert-icon">⚠️</div>
    <div class="alert-label">SERVICE TEMPORARILY UNAVAILABLE</div>
    <h2>सेवा अस्थायी रूपमा बन्द</h2>
    <p>
      क्षमाप्रार्थी छौँ! विविध प्राविधिक तथा अन्य कारणले
      <strong>PDF Download</strong> सेवा हालका लागि बन्द गरिएको छ।
      कृपया सेवा पुनः सञ्चालन नभएसम्म प्रतीक्षा गर्नुहोला।
    </p>
    <div class="alert-footer">🙏 तपाईंको धैर्य र सहयोगका लागि धन्यवाद।<br>
      <b>Sathi Printing Press</b>
    </div>
    <button id="closeServiceAlert" class="alert-close">
      ✓ बुझें, बन्द गर्नुहोस्
    </button>
  </div>
</div>

<style>
.service-alert-overlay {
  display:none; position:fixed; inset:0; z-index:999999;
  align-items:center; justify-content:center; padding:18px;
  background:rgba(2,6,23,.78); backdrop-filter:blur(9px);
}
.service-alert-overlay.show {display:flex; animation:fadeAlert .3s ease}
.service-alert-box {
  position:relative; isolation:isolate; overflow:hidden;
  box-sizing:border-box; width:100%; max-width:440px;
  padding:3px; border-radius:25px;
  background:linear-gradient(120deg,#22d3ee,#6366f1,#e879f9,#fbbf24,#22d3ee);
  background-size:300% 300%; animation:gradientMove 5s linear infinite, popAlert .35s ease;
  box-shadow:0 0 35px #6366f155,0 25px 80px #0008;
}
.service-alert-box > *:not(.alert-pattern) {position:relative}
.alert-pattern {
  position:absolute; inset:3px; z-index:-1; border-radius:22px;
  background:
    radial-gradient(circle at 15% 20%,#22d3ee38 0 2px,transparent 3px),
    radial-gradient(circle at 85% 30%,#e879f940 0 3px,transparent 4px),
    radial-gradient(circle at 25% 80%,#818cf840 0 2px,transparent 3px),
    repeating-linear-gradient(135deg,transparent 0 17px,#ffffff08 18px 19px),
    linear-gradient(135deg,#07152e,#1e1b4b,#111827);
  background-size:100% 100%,100% 100%,100% 100%,auto,300% 300%;
  animation:gradientMove 9s ease infinite;
}
.service-alert-box {
  padding:32px 25px 25px;
  text-align:center; color:white;
}
.alert-x {
  position:absolute!important; top:12px; right:12px;
  width:34px; height:34px; border-radius:50%;
  border:1px solid #ffffff44; background:#ffffff12;
  color:white; font-size:23px; cursor:pointer;
}
.alert-icon {
  display:grid; place-items:center; margin:4px auto 16px;
  width:76px; height:76px; border-radius:23px;
  background:linear-gradient(135deg,#f59e0b35,#f9731630);
  border:1px solid #fbbf2466; font-size:35px;
  box-shadow:0 0 28px #f59e0b20;
  animation:iconFloat 2.5s ease-in-out infinite;
}
.alert-label {
  display:inline-block; padding:7px 12px; margin-bottom:14px;
  border:1px solid #fbbf2455; border-radius:30px;
  color:#fde68a; background:#fbbf2412;
  font-size:10px; font-weight:800; letter-spacing:1px;
}
.service-alert-box h2 {margin:0 0 12px;font-size:24px;color:white}
.service-alert-box p {margin:0;color:#dbeafe;font-size:14px;line-height:2}
.service-alert-box strong {color:#67e8f9}
.alert-footer {
  margin-top:20px;padding-top:16px;border-top:1px solid #ffffff26;
  color:#c7d2fe;font-size:12px;line-height:2
}
.alert-close {
  width:100%; margin-top:22px; padding:14px;
  border:1px solid #ffffff40; border-radius:12px;
  color:white; font-weight:800; font-size:14px; cursor:pointer;
  background:linear-gradient(100deg,#2563eb,#7c3aed,#0891b2,#2563eb);
  background-size:250% 100%; animation:gradientMove 5s linear infinite;
}
.alert-close:hover {filter:brightness(1.15);transform:translateY(-1px)}
@keyframes gradientMove {to{background-position:300% 50%}}
@keyframes fadeAlert {from{opacity:0}to{opacity:1}}
@keyframes popAlert {from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}
@keyframes iconFloat {50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<script>
(function(){
  const modal=document.getElementById('serviceAlert');
  const download=document.getElementById('downloadBtn');
  const close=document.getElementById('closeServiceAlert');
  const x=document.getElementById('closeServiceAlertX');

  if(!modal || !download || !close) return;

  download.addEventListener('click',function(e){
    e.preventDefault();
    e.stopImmediatePropagation();
    modal.classList.add('show');
  },true);

  function hide(){modal.classList.remove('show')}
  close.addEventListener('click',hide);
  if(x)x.addEventListener('click',hide);
  modal.addEventListener('click',function(e){
    if(e.target===modal)hide();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')hide();
  });
})();
</script>
